name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter
          path: target/release/inf-splitter
      - name: Build .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb --locked
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter-deb
          path: target/debian/inf-splitter_*.deb

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Bundle Windows package
        shell: pwsh
        run: |
          $staging = "staging\inf-splitter"
          New-Item -ItemType Directory -Force -Path "$staging\logs" | Out-Null
          Copy-Item target\release\inf-splitter.exe $staging\
          Copy-Item packaging\windows\winsw.xml $staging\
          Copy-Item packaging\windows\config.toml $staging\
          Copy-Item packaging\windows\install.ps1 $staging\
          Compress-Archive -Path staging\* -DestinationPath inf-splitter-windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter-windows
          path: inf-splitter-windows.zip

  rust-test:
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          cp config/inf-splitter.toml.example config/inf-splitter.toml
          cargo test --locked

  smoke:
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: inf-splitter
          path: target/release/
      - run: chmod +x target/release/inf-splitter
      - name: Build image from pre-built binary
        run: |
          cp target/release/inf-splitter ./inf-splitter.bin
          docker build -f Dockerfile.ci -t inf-splitter:smoke-test .
          rm -f ./inf-splitter.bin
      - name: Smoke test
        run: SKIP_BUILD=1 ./scripts/docker-smoke-test.sh

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter
          path: target/release/inf-splitter

  rust-test:
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          cp config/inf-splitter.toml.example config/inf-splitter.toml
          cargo test --locked

  smoke:
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: inf-splitter
          path: target/release/
      - run: chmod +x target/release/inf-splitter
      - name: Build image from pre-built binary
        run: docker build -f Dockerfile.ci -t inf-splitter:smoke-test .
      - name: Smoke test
        run: SKIP_BUILD=1 ./scripts/docker-smoke-test.sh

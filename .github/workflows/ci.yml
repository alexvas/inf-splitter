name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0). Must be valid semver.'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # --- Regular CI (every push) ---

  rust-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Check third-party notices
        run: |
          python3 scripts/generate-third-party-notices.py
          git diff --exit-code THIRD_PARTY_NOTICES || {
            echo "THIRD_PARTY_NOTICES is out of date."
            echo "Run: python3 scripts/generate-third-party-notices.py"
            exit 1
          }
      - name: Check README sync
        run: |
          RU=$(grep -c '^## ' README.md)
          EN=$(grep -c '^## ' README.en.md)
          ZH=$(grep -c '^## ' README.zh.md)
          if [ "$RU" != "$EN" ] || [ "$RU" != "$ZH" ]; then
            echo "README heading count mismatch: RU=$RU EN=$EN ZH=$ZH"
            echo "Keep all three READMEs in sync."
            exit 1
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter-linux_amd64.bin
          path: target/release/inf-splitter

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
        run: |
          cp config/inf-splitter.toml.example config/inf-splitter.toml
          cargo test --locked

  smoke:
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: inf-splitter-linux_amd64.bin
          path: target/release/
      - run: chmod +x target/release/inf-splitter
      - name: Build image from pre-built binary
        run: |
          cp target/release/inf-splitter ./inf-splitter.bin
          docker build -f Dockerfile.ci -t inf-splitter:smoke-test .
          rm -f ./inf-splitter.bin
      - name: Smoke test
        run: SKIP_BUILD=1 ./scripts/docker-smoke-test.sh

  # --- Release jobs (tags, workflow_dispatch) ---

  linux-release:
    needs: [rust-test, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Get package version
        id: pkg_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set version in manifests
        env:
          VERSION: ${{ steps.pkg_version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          sed -i '/^name = "inf-splitter"/{n;s/version = ".*"/version = "'"${VERSION}"'"/}' Cargo.lock

      - name: Build .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb --locked
          cp target/debian/inf-splitter_*.deb .
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter-deb
          path: inf-splitter_*.deb

  windows-release:
    needs: rust-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Get package version
        id: pkg_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set version in manifests
        shell: bash
        env:
          VERSION: ${{ steps.pkg_version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          sed -i '/^name = "inf-splitter"/{n;s/version = ".*"/version = "'"${VERSION}"'"/}' Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked
      - name: Bundle Windows package
        shell: pwsh
        run: |
          $staging = "staging\inf-splitter"
          New-Item -ItemType Directory -Force -Path "$staging\logs" | Out-Null
          Copy-Item target\release\inf-splitter.exe $staging\
          Copy-Item packaging\windows\winsw.xml $staging\
          Copy-Item packaging\windows\config.toml $staging\
          Copy-Item packaging\windows\install.ps1 $staging\
          Compress-Archive -Path staging\* -DestinationPath inf-splitter-windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: inf-splitter-windows
          path: inf-splitter-windows.zip

  create-release:
    needs: [linux-release, windows-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version (semver)
        if: github.event_name == 'workflow_dispatch'
        uses: matt-usurp/validate-semver@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Get version from tag or input
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG_NAME="v${VERSION}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: inf-splitter-linux_amd64.bin

      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: inf-splitter-deb

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: inf-splitter-windows

      - run: chmod +x inf-splitter
      - run: cp inf-splitter inf-splitter-linux_amd64.bin

      - name: Delete existing release if present
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing release: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists, deleting..."
            gh release delete "$TAG" --yes
            echo "Release deleted successfully"
          else
            echo "Release does not exist, will create new one"
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag exists, deleting..."
            git push origin --delete "refs/tags/$TAG" || true
            echo "Tag deleted successfully"
          else
            echo "Tag does not exist, will create new one"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.VERSION }}
          body: |
            ## inf-splitter ${{ env.VERSION }}

            Тонкий HTTP-роутер для запросов инференса: маршрутизация по модели на OpenAI- и Anthropic-совместимые upstream.
            A thin HTTP router for inference requests: model-based routing to OpenAI- and Anthropic-compatible upstreams.
            一个轻量级HTTP路由器，用于推理请求：基于模型的路由到OpenAI和Anthropic兼容的上游。

            ### Установка. Install. 安装。

            #### Linux (.deb)

            Скачайте `.deb` файл и установите. После установки отредактируйте конфиг и задайте API-ключи.
            Download the `.deb` file and install. After installation, edit the config and set API keys.
            下载`.deb`文件并安装。安装后编辑配置并设置API密钥。

            ```bash
            cd /tmp
            wget https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/inf-splitter_${{ env.VERSION }}-1_amd64.deb
            sudo dpkg -i inf-splitter_${{ env.VERSION }}-1_amd64.deb
            ```

            После установки / After installation / 安装后:
            1. Отредактируйте `/etc/inf-splitter/inf-splitter.toml` — укажите свои upstream.
               Edit `/etc/inf-splitter/inf-splitter.toml` — configure your upstreams.
               编辑 `/etc/inf-splitter/inf-splitter.toml` — 配置您的上游。
            2. Заполните `/etc/inf-splitter/environment` — задайте API-ключи (формат `VAR=value`, по одной на строку).
               Fill `/etc/inf-splitter/environment` — set API keys (format `VAR=value`, one per line).
               填写 `/etc/inf-splitter/environment` — 设置API密钥（格式 `VAR=value`，每行一个）。
            3. Сервис уже запущен: `systemctl status inf-splitter`.
               The service is already running: `systemctl status inf-splitter`.
               服务已启动: `systemctl status inf-splitter`.

            ```bash
            sudo systemctl restart inf-splitter   # после изменения конфига / after config change / 配置更改后
            journalctl -u inf-splitter -f          # логи / logs / 日志
            ```

            #### Windows

            Скачайте `inf-splitter-windows.zip`, распакуйте и запустите `install.ps1` от имени администратора.
            Download `inf-splitter-windows.zip`, unzip and run `install.ps1` as Administrator.
            下载 `inf-splitter-windows.zip`，解压并以管理员身份运行 `install.ps1`。

            ```powershell
            Expand-Archive inf-splitter-windows.zip -DestinationPath C:\temp\inf-splitter
            cd C:\temp\inf-splitter\inf-splitter
            .\install.ps1
            ```

            После установки / After installation / 安装后:
            1. Отредактируйте `%ProgramData%\inf-splitter\config.toml`.
               Edit `%ProgramData%\inf-splitter\config.toml`.
               编辑 `%ProgramData%\inf-splitter\config.toml`。
            2. Задайте API-ключи: `& "$env:ProgramData\inf-splitter\inf-splitter-service.exe" set VAR=value`.
               Set API keys: `& "$env:ProgramData\inf-splitter\inf-splitter-service.exe" set VAR=value`.
               设置API密钥: `& "$env:ProgramData\inf-splitter\inf-splitter-service.exe" set VAR=value`。
            3. Перезапустите сервис: `Restart-Service inf-splitter`.
               Restart the service: `Restart-Service inf-splitter`.
               重启服务: `Restart-Service inf-splitter`。
          files: |
            inf-splitter-linux_amd64.bin
            inf-splitter_*.deb
            inf-splitter-windows.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

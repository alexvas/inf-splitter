[package]
name = "inf-splitter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "HTTP router for inference requests to OpenAI- and Anthropic-compatible upstreams"
readme = "README.md"

[package.metadata.deb]
maintainer = "Aleksandr Vasilev <a.a.vasiljev+infsplitter@yandex.ru>"
maintainer-scripts = "debian/"
systemd-units = { enable = true }
assets = [
    ["target/release/inf-splitter", "/usr/bin/inf-splitter", "755"],
    ["config/inf-splitter.toml.example", "/etc/inf-splitter/inf-splitter.toml", "644"],
    ["debian/inf-splitter.env.example", "/usr/share/inf-splitter/inf-splitter.env.example", "644"],
]

[dependencies]
anyllm_translate = "0.9"
axum = "0.8"
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "system-proxy", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"

[build-dependencies]
serde_json = "1"

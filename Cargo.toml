[package]
name = "inf-splitter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "HTTP router for inference requests to OpenAI- and Anthropic-compatible upstreams"
readme = "README.md"

[dependencies]
anyllm_translate = "0.9"
axum = "0.8"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "system-proxy", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
